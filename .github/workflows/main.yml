name: Build VoidKeys APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate click.wav if missing
        run: |
          mkdir -p app/src/main/res/raw
          if [ ! -f app/src/main/res/raw/click.wav ]; then
            python3 -c 'import math, struct, wave; r=22050; n=int(r*0.04); w=wave.open("app/src/main/res/raw/click.wav","w"); w.setnchannels(1); w.setsampwidth(2); w.setframerate(r); w.writeframes(b"".join(struct.pack("<h", int(16000*(1-i/n)*math.sin(2*math.pi*(620-380*i/n)*i/r))) for i in range(n))); w.close()'
          fi

      - name: Build Android App APK
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          fi
          chmod +x gradlew
          ./gradlew assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/VoidKeys.apk

      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: VoidKeys v0.1.${{ github.run_number }}
          files: dist/VoidKeys.apk
