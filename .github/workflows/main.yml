              private class CuteCatWatermarkDrawable(
                  private val tintColor: Int
              ) : Drawable() {
                  private val bodyPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = tintColor
                      alpha = 96
                      style = Paint.Style.FILL
                  }
                  private val linePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = tintColor
                      alpha = 155
                      style = Paint.Style.STROKE
                      strokeWidth = 6.5f
                      strokeCap = Paint.Cap.ROUND
                      strokeJoin = Paint.Join.ROUND
                  }
                  private val blushPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.parseColor("#FF8FAB")
                      alpha = 115
                      style = Paint.Style.FILL
                  }

                  override fun draw(canvas: Canvas) {
                      val w = bounds.width().toFloat()
                      val h = bounds.height().toFloat()
                      if (w <= 0f || h <= 0f) return

                      val cx = w * 0.5f
                      val cy = h * 0.56f
                      val radius = minOf(w, h) * 0.27f

                      val leftEar = Path().apply {
                          moveTo(cx - radius * 0.85f, cy - radius * 0.45f)
                          lineTo(cx - radius * 0.92f, cy - radius * 1.28f)
                          lineTo(cx - radius * 0.22f, cy - radius * 0.88f)
                          close()
                      }
                      val rightEar = Path().apply {
                          moveTo(cx + radius * 0.85f, cy - radius * 0.45f)
                          lineTo(cx + radius * 0.92f, cy - radius * 1.28f)
                          lineTo(cx + radius * 0.22f, cy - radius * 0.88f)
                          close()
                      }
                      canvas.drawPath(leftEar, bodyPaint)
                      canvas.drawPath(rightEar, bodyPaint)
                      canvas.drawPath(leftEar, linePaint)
                      canvas.drawPath(rightEar, linePaint)

                      canvas.drawCircle(cx, cy, radius, bodyPaint)
                      canvas.drawCircle(cx, cy, radius, linePaint)

                      canvas.drawCircle(cx - radius * 0.56f, cy + radius * 0.14f, radius * 0.17f, blushPaint)
                      canvas.drawCircle(cx + radius * 0.56f, cy + radius * 0.14f, radius * 0.17f, blushPaint)

                      val eyeY = cy - radius * 0.08f
                      val eyeOffsetX = radius * 0.36f
                      val eyeR = radius * 0.14f
                      canvas.drawArc(
                          cx - eyeOffsetX - eyeR,
                          eyeY - eyeR,
                          cx - eyeOffsetX + eyeR,
                          eyeY + eyeR,
                          190f,
                          160f,
                          false,
                          linePaint
                      )
                      canvas.drawArc(
                          cx + eyeOffsetX - eyeR,
                          eyeY - eyeR,
                          cx + eyeOffsetX + eyeR,
                          eyeY + eyeR,
                          190f,
                          160f,
                          false,
                          linePaint
                      )

                      val noseY = cy + radius * 0.14f
                      val nosePath = Path().apply {
                          moveTo(cx - radius * 0.09f, noseY - radius * 0.04f)
                          lineTo(cx + radius * 0.09f, noseY - radius * 0.04f)
                          lineTo(cx, noseY + radius * 0.07f)
                          close()
                      }
                      canvas.drawPath(nosePath, linePaint)

                      val mouthY = noseY + radius * 0.07f
                      canvas.drawArc(
                          cx - radius * 0.22f,
                          mouthY - radius * 0.06f,
                          cx,
                          mouthY + radius * 0.12f,
                          15f,
                          150f,
                          false,
                          linePaint
                      )
                      canvas.drawArc(
                          cx,
                          mouthY - radius * 0.06f,
                          cx + radius * 0.22f,
                          mouthY + radius * 0.12f,
                          15f,
                          150f,
                          false,
                          linePaint
                      )

                      val whiskY1 = cy + radius * 0.08f
                      val whiskY2 = cy + radius * 0.24f
                      canvas.drawLine(cx - radius * 0.72f, whiskY1, cx - radius * 1.42f, whiskY1 - radius * 0.08f, linePaint)
                      canvas.drawLine(cx - radius * 0.72f, whiskY2, cx - radius * 1.42f, whiskY2 + radius * 0.06f, linePaint)
                      canvas.drawLine(cx + radius * 0.72f, whiskY1, cx + radius * 1.42f, whiskY1 - radius * 0.08f, linePaint)
                      canvas.drawLine(cx + radius * 0.72f, whiskY2, cx + radius * 1.42f, whiskY2 + radius * 0.06f, linePaint)
                  }

                  override fun setAlpha(alpha: Int) {
                      bodyPaint.alpha = alpha
                      linePaint.alpha = alpha
                      invalidateSelf()
                  }

                  override fun setColorFilter(colorFilter: ColorFilter?) {
                      bodyPaint.colorFilter = colorFilter
                      linePaint.colorFilter = colorFilter
                      invalidateSelf()
                  }

                  @Deprecated("Deprecated in Java")
                  override fun getOpacity(): Int = PixelFormat.TRANSLUCENT
              }

              override fun onCreate() {
                  super.onCreate()
                  val attrs = AudioAttributes.Builder()
                      .setUsage(AudioAttributes.USAGE_ASSISTANCE_SONIFICATION)
                      .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                      .build()
                  soundPool = SoundPool.Builder()
                      .setMaxStreams(4)
                      .setAudioAttributes(attrs)
                      .build()
                  clickSoundId = soundPool.load(this, R.raw.click, 1)
                  soundPool.setOnLoadCompleteListener { _, _, status ->
                      soundLoaded = (status == 0)
                  }
              }

              override fun onCreateInputView(): View {
                  rootLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(12, 10, 12, 22)
                  }
                  applyTheme()
                  rebuildKeys()
                  return rootLayout
              }

              override fun onStartInputView(info: EditorInfo?, restarting: Boolean) {
                  super.onStartInputView(info, restarting)
                  if (::rootLayout.isInitialized) {
                      applyTheme()
                      rebuildKeys()
                  }
              }

              override fun onUpdateSelection(
                  oldSelStart: Int,
                  oldSelEnd: Int,
                  newSelStart: Int,
                  newSelEnd: Int,
                  candidatesStart: Int,
                  candidatesEnd: Int
              ) {
                  super.onUpdateSelection(oldSelStart, oldSelEnd, newSelStart, newSelEnd, candidatesStart, candidatesEnd)
                  updateSuggestions()
              }

              override fun onFinishInputView(finishingInput: Boolean) {
                  stopHoldDelete(null)
                  super.onFinishInputView(finishingInput)
              }

              private fun makeKeyDrawable(
                  fillColor: Int,
                  strokeColor: Int = currentStrokeColor,
                  radius: Float = 22f,
                  strokeWidth: Int = 2
              ): GradientDrawable {
                  return GradientDrawable().apply {
                      setColor(fillColor)
                      cornerRadius = radius
                      setStroke(strokeWidth, strokeColor)
                  }
              }

