name: Build VoidKeys APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate click.wav if missing
        run: |
          mkdir -p app/src/main/res/raw
          if [ ! -f app/src/main/res/raw/click.wav ]; then
            cat << 'PYEOF' > make_click.py
          import math, struct, wave

          rate = 22050
          frames = int(rate * 0.04)
          with wave.open("app/src/main/res/raw/click.wav", "w") as w:
              w.setnchannels(1)
              w.setsampwidth(2)
              w.setframerate(rate)
              for i in range(frames):
                  env = 1.0 - (i / frames)
                  freq = 620.0 - (i / frames) * 380.0
                  sample = int(16000 * env * math.sin(2.0 * math.pi * freq * i / rate))
                  w.writeframes(struct.pack("<h", sample))
          PYEOF
            python3 make_click.py
            rm -f make_click.py
          fi

      - name: Build Android App APK
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          fi
          chmod +x gradlew
          ./gradlew assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/VoidKeys.apk

      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: VoidKeys v0.1.${{ github.run_number }}
          files: dist/VoidKeys.apk
