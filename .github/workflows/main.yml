              private fun cycleTheme() {
                  val prefs = getSharedPreferences("voidkeys_prefs", Context.MODE_PRIVATE)
                  val current = prefs.getString("active_theme", "void") ?: "void"
                  val next = themeOrder[(themeOrder.indexOf(current) + 1) % themeOrder.size]
                  prefs.edit().putString("active_theme", next).apply()
                  applyTheme()
                  rebuildKeys()
                  showBadgeMessage("✨ Тема: $next")
              }

              private fun openVoidKeysApp() {
                  val intent = Intent(this, MainActivity::class.java).apply {
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  }
                  startActivity(intent)
              }

              private fun openKeyboardSettings() {
                  val intent = Intent(Settings.ACTION_INPUT_METHOD_SETTINGS).apply {
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  }
                  startActivity(intent)
              }

              private fun toggleLanguage() {
                  isEnglish = !isEnglish
                  rebuildKeys()
                  showBadgeMessage(if (isEnglish) "🌐 English (EN)" else "🌐 Русский (RU)")
              }

              private fun toggleShift() {
                  isShifted = !isShifted
                  rebuildKeys()
                  showBadgeMessage(if (isShifted) "⇧ ЗАГЛАВНЫЕ" else "⇩ строчные")
              }

              private fun toggleClipboardBar() {
                  clipboardVisible = !clipboardVisible
                  if (clipboardVisible) {
                      emojiVisible = false
                      altCharVisible = false
                      if (::emojiBar.isInitialized) emojiBar.visibility = View.GONE
                      if (::altCharBar.isInitialized) altCharBar.visibility = View.GONE
                  }
                  rebuildClipboardBar()
                  if (::clipboardBar.isInitialized) {
                      clipboardBar.visibility = if (clipboardVisible) View.VISIBLE else View.GONE
                  }
                  showBadgeMessage(if (clipboardVisible) "📋 Буфер обмена" else "Клавиатура")
              }

              private fun rebuildClipboardBar() {
                  if (!::clipboardBar.isInitialized) return
                  clipboardBar.removeAllViews()
                  val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  val clipText = cm.primaryClip?.getItemAt(0)?.coerceToText(this)?.toString()?.trim().orEmpty()
                  val label = if (clipText.isEmpty()) "Буфер пуст" else "Вставить: ${clipText.take(24)}"
                  clipboardBar.addView(Button(this).apply {
                      text = label
                      isAllCaps = false
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.WHITE)
                      background = makeKeyDrawable(currentAccentFill, currentStrokeColor, 20f, 2)
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          92
                      )
                      setOnClickListener {
                          playTapEffects()
                          if (clipText.isNotEmpty()) {
                              currentInputConnection?.commitText(clipText, 1)
                              updateSuggestions()
                              showBadgeMessage("✓ Вставлено")
                          }
                          clipboardVisible = false
                          clipboardBar.visibility = View.GONE
                      }
                  })
              }

              private fun showBadgeMessage(text: String, keepVisible: Boolean = false) {
                  if (!::keyPreviewBadge.isInitialized) return
                  keyPreviewBadge.text = text
                  keyPreviewBadge.alpha = 1f
                  keyPreviewBadge.scaleX = 1.14f
                  keyPreviewBadge.scaleY = 1.14f
                  keyPreviewBadge.animate()
                      .scaleX(1.0f)
                      .scaleY(1.0f)
                      .setDuration(110L)
                      .start()
                  handler.removeCallbacks(hideBadgeRunnable)
                  if (!keepVisible) {
                      handler.postDelayed(hideBadgeRunnable, 500L)
                  }
              }

              private val hideBadgeRunnable = Runnable {
                  if (::keyPreviewBadge.isInitialized && !isListening && !isDeletingHeld && !altCharVisible) {
                      keyPreviewBadge.animate().alpha(0.45f).setDuration(200L).start()
                  }
              }

              private fun showKeyAnimation(
                  btn: Button,
                  label: String,
                  defaultFill: Int = currentKeyFill,
                  defaultStroke: Int = currentStrokeColor,
                  radius: Float = 22f
              ) {
                  btn.animate().cancel()
                  btn.scaleX = 1.15f
                  btn.scaleY = 1.15f
                  btn.translationY = -8f
                  btn.background = makeKeyDrawable(currentPopColor, Color.WHITE, radius, 2)
                  btn.animate()
                      .scaleX(1.0f)
                      .scaleY(1.0f)
                      .translationY(0f)
                      .setDuration(130L)
                      .withEndAction {
                          btn.background = makeKeyDrawable(defaultFill, defaultStroke, radius, 2)
                      }
                      .start()

                  showBadgeMessage(label)
              }

              private fun startVoiceTyping() {
                  val hasMicPermission = ContextCompat.checkSelfPermission(
                      this,
                      Manifest.permission.RECORD_AUDIO
                  ) == PackageManager.PERMISSION_GRANTED

                  if (!hasMicPermission) {
                      showBadgeMessage("Выдай микрофон в приложении VoidKeys")
                      return
                  }

                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      showBadgeMessage("Голосовой сервис недоступен")
                      return
                  }

                  if (isListening) {
                      speechRecognizer?.stopListening()
                      isListening = false
                      showBadgeMessage("Голосовой ввод остановлен")
                      return
                  }

                  handler.post {
                      speechRecognizer?.destroy()
                      val recognizer = SpeechRecognizer.createSpeechRecognizer(this)
                      speechRecognizer = recognizer

                      recognizer.setRecognitionListener(object : RecognitionListener {
                          override fun onReadyForSpeech(params: Bundle?) {
                              isListening = true
                              showBadgeMessage("🎤 Говорите...", keepVisible = true)
                          }

                          override fun onBeginningOfSpeech() {
                              showBadgeMessage("🎤 Слушаю...", keepVisible = true)
                          }

                          override fun onRmsChanged(rmsdB: Float) {}
                          override fun onBufferReceived(buffer: ByteArray?) {}

                          override fun onEndOfSpeech() {
                              isListening = false
                              showBadgeMessage("Распознаю...")
                          }

                          override fun onError(error: Int) {
                              isListening = false
                              showBadgeMessage("Не расслышал — зажми пробел снова")
                          }

                          override fun onResults(results: Bundle?) {
                              isListening = false
                              val matches = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                              val spoken = matches?.firstOrNull()?.trim()
                              if (!spoken.isNullOrEmpty()) {
                                  currentInputConnection?.commitText("$spoken ", 1)
                                  updateSuggestions()
                                  showBadgeMessage("✓ $spoken")
                              } else {
                                  showBadgeMessage("Речь не распознана")
                              }
                          }

                          override fun onPartialResults(partialResults: Bundle?) {
                              val partial = partialResults
                                  ?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                                  ?.firstOrNull()
                              if (!partial.isNullOrEmpty()) {
                                  showBadgeMessage("🎤 $partial", keepVisible = true)
                              }
                          }

                          override fun onEvent(eventType: Int, params: Bundle?) {}
                      })

                      val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE, if (isEnglish) "en-US" else "ru-RU")
                          putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                      }

                      vibrateMs(30L)
                      isListening = true
                      showBadgeMessage("🎤 Говорите...", keepVisible = true)
                      recognizer.startListening(intent)
                  }
              }

              private fun toggleEmojiBar() {
                  emojiVisible = !emojiVisible
                  if (emojiVisible) {
                      clipboardVisible = false
                      altCharVisible = false
                      if (::clipboardBar.isInitialized) clipboardBar.visibility = View.GONE
                      if (::altCharBar.isInitialized) altCharBar.visibility = View.GONE
                  }
                  if (::emojiBar.isInitialized) {
                      emojiBar.visibility = if (emojiVisible) View.VISIBLE else View.GONE
                  }
                  showBadgeMessage(if (emojiVisible) "☺ Смайлики" else "Клавиатура")
              }

              private fun rebuildKeys() {
                  stopHoldDelete(null)
                  altCharVisible = false
                  rootLayout.removeAllViews()

                  val topBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply {
                          bottomMargin = 6
                      }
                  }

                  val topActions = listOf(
                      "👑" to { openVoidKeysApp() },
                      "✨" to { cycleTheme() },
                      "📋" to { toggleClipboardBar() },
                      "Aあ" to { toggleLanguage() },
                      "⚙️" to { openKeyboardSettings() },
                      "☺" to { toggleEmojiBar() }
                  )

                  for ((iconText, action) in topActions) {
                      topBar.addView(Button(this).apply {
                          text = iconText
                          isAllCaps = false
                          typeface = Typeface.DEFAULT_BOLD
                          setTextColor(Color.WHITE)
                          background = makeKeyDrawable(currentKeyFill, currentStrokeColor, 18f, 2)
                          layoutParams = LinearLayout.LayoutParams(
                              0,
                              86,
                              1f
                          ).apply {
                              marginStart = 3
                              marginEnd = 3
                          }
                          setOnClickListener {
                              playTapEffects()
                              action()
                          }
                      })
                  }
                  rootLayout.addView(topBar)

                  suggestionBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply {
                          bottomMargin = 5
                      }
                  }
                  rootLayout.addView(suggestionBar)

                  keyPreviewBadge = TextView(this).apply {
                      text = if (isEnglish) "EN • hold space for voice" else "RU • зажми «е» для ё/ю"
                      textSize = 11f
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      alpha = 0.5f
                      background = makeKeyDrawable(currentAccentFill, currentStrokeColor, 20f, 1)
                      setPadding(24, 4, 24, 4)
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply {
                          gravity = Gravity.CENTER_HORIZONTAL
                          bottomMargin = 4
                      }
                  }
                  rootLayout.addView(keyPreviewBadge)

                  altCharBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      visibility = View.GONE
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply {
                          bottomMargin = 6
                      }
                  }
                  rootLayout.addView(altCharBar)

                  clipboardBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      visibility = if (clipboardVisible) View.VISIBLE else View.GONE
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply {
                          bottomMargin = 6
                      }
                  }
                  rebuildClipboardBar()
                  rootLayout.addView(clipboardBar)

                  emojiBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      visibility = if (emojiVisible) View.VISIBLE else View.GONE
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply {
                          bottomMargin = 6
                      }
                  }
                  for (em in emojis) {
                      emojiBar.addView(Button(this).apply {
                          text = em
                          isAllCaps = false
                          setTextColor(Color.WHITE)
                          background = makeKeyDrawable(currentKeyFill, currentStrokeColor, 18f, 2)
                          layoutParams = LinearLayout.LayoutParams(
                              0,
                              90,
                              1f
                          ).apply {
                              marginStart = 2
                              marginEnd = 2
                          }
                          setOnClickListener {
                              showKeyAnimation(this, em, currentKeyFill, currentStrokeColor, 18f)
                              playTapEffects()
                              currentInputConnection?.commitText(em, 1)
                              updateSuggestions()
                          }
                      })
                  }
                  rootLayout.addView(emojiBar)

                  val numbersView = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply {
                          bottomMargin = 4
                      }
                  }
                  for (num in numRow) {
                      numbersView.addView(Button(this).apply {
                          text = num
                          isAllCaps = false
                          typeface = Typeface.DEFAULT_BOLD
                          setTextColor(Color.WHITE)
                          background = makeKeyDrawable(currentKeyFill, currentStrokeColor, 16f, 2)
                          layoutParams = LinearLayout.LayoutParams(
                              0,
                              84,
                              1f
                          ).apply {
                              marginStart = 2
                              marginEnd = 2
                          }
                          setOnClickListener {
                              showKeyAnimation(this, num, currentKeyFill, currentStrokeColor, 16f)
                              handleKey(num)
                          }
                      })
                  }
                  rootLayout.addView(numbersView)

                  val activeRows = if (isEnglish) enRows else ruRows
                  for (rowKeys in activeRows) {
                      val rowView = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER
                          layoutParams = LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          ).apply {
                              topMargin = 7
                          }
                      }
                      for (rawLabel in rowKeys) {
                          val isSpace = rawLabel == "пробел" || rawLabel == "space"
                          val isLangBtn = rawLabel.startsWith("🌐")
                          val isShiftBtn = rawLabel == "⇧"
                          val isEnterBtn = rawLabel == "↵"
                          val isDeleteBtn = rawLabel == "⌫"
                          val isLetter = rawLabel.length == 1 && rawLabel[0].isLetter()
                          val supportsAlt = !isEnglish && rawLabel.equals("е", ignoreCase = true)
                          val displayLabel = when {
                              isSpace -> "$rawLabel (🎤)"
                              isLetter && isShifted -> rawLabel.uppercase()
                              else -> rawLabel
                          }
                          val baseFill = when {
                              isEnterBtn || (isShiftBtn && isShifted) -> currentAccentFill
                              isLangBtn || isDeleteBtn || rawLabel == "☺" || isShiftBtn -> currentPopColor
                              else -> currentKeyFill
                          }

                          rowView.addView(Button(this).apply {
                              text = displayLabel
                              isAllCaps = false
                              typeface = Typeface.DEFAULT_BOLD
                              textSize = if (isSpace || isLangBtn) 13f else 15f
                              setTextColor(Color.WHITE)
                              background = makeKeyDrawable(baseFill, currentStrokeColor, 22f, 2)
                              val weight = when {
                                  isSpace -> 3.0f
                                  isLangBtn -> 1.4f
                                  isShiftBtn -> 1.25f
                                  else -> 1f
                              }
                              layoutParams = LinearLayout.LayoutParams(
                                  0,
                                  114,
                                  weight
                              ).apply {
                                  marginStart = 3
                                  marginEnd = 3
                              }
                              if (isDeleteBtn) {
                                  setOnTouchListener { v, event ->
                                      val btnView = v as Button
                                      when (event.actionMasked) {
                                          MotionEvent.ACTION_DOWN -> {
                                              startHoldDelete(btnView)
                                              true
                                          }
                                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                                              stopHoldDelete(btnView)
                                              true
                                          }
                                          else -> false
                                      }
                                  }
                              } else {
                                  setOnClickListener {
                                      if (isLangBtn) {
                                          playTapEffects()
                                          toggleLanguage()
                                          return@setOnClickListener
                                      }
                                      if (isShiftBtn) {
                                          playTapEffects()
                                          toggleShift()
                                          return@setOnClickListener
                                      }
                                      if (altCharVisible) {
                                          altCharVisible = false
                                          if (::altCharBar.isInitialized) altCharBar.visibility = View.GONE
                                      }
                                      showKeyAnimation(this, if (isSpace) "␣" else displayLabel, baseFill, currentStrokeColor, 22f)
                                      handleKey(displayLabel)
                                  }
                              }
                              if (supportsAlt) {
                                  setOnLongClickListener {
                                      showAltCharPicker(rawLabel)
                                      true
                                  }
                              }
                              if (isSpace) {
                                  setOnLongClickListener {
                                      startVoiceTyping()
                                      true
                                  }
                              }
                          })
                      }
                      rootLayout.addView(rowView)
                  }

                  updateSuggestions()
              }

              private fun handleKey(label: String) {
                  playTapEffects()
                  if (label == "☺") {
                      toggleEmojiBar()
                      return
                  }
                  val ic = currentInputConnection ?: return
                  when {
                      label == "⌫" -> {
                          ic.deleteSurroundingText(1, 0)
                          updateSuggestions()
                      }
                      label.startsWith("пробел") || label.startsWith("space") -> {
                          ic.commitText(" ", 1)
                          updateSuggestions()
                      }
                      label == "↵" -> {
                          sendDefaultEditorAction(true)
                          updateSuggestions()
                      }
                      else -> {
                          ic.commitText(label, 1)
                          if (isShifted && label.length == 1 && label[0].isLetter()) {
                              isShifted = false
                              rebuildKeys()
                          } else {
                              updateSuggestions()
                          }
                      }
                  }
              }

              private fun vibrateMs(ms: Long) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      val vm = getSystemService(Context.VIBRATOR_MANAGER_SERVICE) as VibratorManager
                      vm.defaultVibrator.vibrate(
                          VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE)
                      )
                  } else {
                      @Suppress("DEPRECATION")
                      val vib = getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          vib.vibrate(
                              VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE)
                          )
                      } else {
                          @Suppress("DEPRECATION")
                          vib.vibrate(ms)
                      }
                  }
              }

              private fun playTapEffects() {
                  if (soundLoaded) {
                      soundPool.play(clickSoundId, 0.85f, 0.85f, 1, 0, currentPitch)
                  }
                  vibrateMs(currentVibMs)
              }

              override fun onDestroy() {
                  stopHoldDelete(null)
                  isListening = false
                  speechRecognizer?.destroy()
                  handler.removeCallbacksAndMessages(null)
                  soundPool.release()
                  super.onDestroy()
              }
          }
          """, overwrite=True)

          write_rich_icon("app/src/main/res/drawable/ic_launcher.png")

          wav_path = "app/src/main/res/raw/click.wav"
          if not os.path.exists(wav_path):
              os.makedirs(os.path.dirname(wav_path), exist_ok=True)
              rate, frames = 22050, int(22050 * 0.04)
              with wave.open(wav_path, "w") as w:
                  w.setnchannels(1)
                  w.setsampwidth(2)
                  w.setframerate(rate)
                  for i in range(frames):
                      env = 1.0 - (i / frames)
                      freq = 620.0 - (i / frames) * 380.0
                      sample = int(16000 * env * math.sin(2.0 * math.pi * freq * i / rate))
                      w.writeframes(struct.pack("<h", sample))
          PY

