              private val holdDeleteRunnable = object : Runnable {
                  override fun run() {
                      if (!isDeletingHeld) return
                      deleteRepeatCount++
                      val countToDelete = if (deleteRepeatCount > 18) 3 else 1
                      currentInputConnection?.deleteSurroundingText(countToDelete, 0)
                      playTapEffects()
                      updateSuggestions()
                      val nextDelay = when {
                          deleteRepeatCount > 18 -> 45L
                          deleteRepeatCount > 6 -> 75L
                          else -> 120L
                      }
                      handler.postDelayed(this, nextDelay)
                  }
              }

              private fun startHoldDelete(btn: Button) {
                  stopHoldDelete(btn)
                  isDeletingHeld = true
                  deleteRepeatCount = 0
                  btn.scaleX = 1.14f
                  btn.scaleY = 1.14f
                  btn.background = makeKeyDrawable(currentPopColor, Color.WHITE, 22f, 2)
                  currentInputConnection?.deleteSurroundingText(1, 0)
                  playTapEffects()
                  updateSuggestions()
                  showBadgeMessage("⌫ стираю...", keepVisible = true)
                  handler.postDelayed(holdDeleteRunnable, 320L)
              }

              private fun stopHoldDelete(btn: Button?) {
                  isDeletingHeld = false
                  deleteRepeatCount = 0
                  handler.removeCallbacks(holdDeleteRunnable)
                  if (btn != null) {
                      btn.animate().cancel()
                      btn.scaleX = 1.0f
                      btn.scaleY = 1.0f
                      btn.translationY = 0f
                      btn.background = makeKeyDrawable(currentPopColor, currentStrokeColor, 22f, 2)
                  }
                  if (!isListening) {
                      showBadgeMessage("⌫")
                  }
              }

              private fun getCurrentWordPrefix(): String {
                  val before = currentInputConnection?.getTextBeforeCursor(40, 0)?.toString().orEmpty()
                  if (before.isEmpty() || before.last().isWhitespace()) return ""
                  val lastToken = before.takeLastWhile { !it.isWhitespace() }
                  return lastToken.trimStart { !it.isLetter() }
              }

              private fun findPredictions(prefix: String): List<String> {
                  val lower = prefix.lowercase()
                  val dict = if (isEnglish) enDictionary else ruDictionary
                  if (lower.isEmpty()) {
                      return if (isEnglish) {
                          listOf("Hello", "How", "Thanks")
                      } else {
                          listOf("Привет", "Как", "Спасибо")
                      }
                  }
                  val matches = dict.filter { word ->
                      word.startsWith(lower) && word != lower
                  }.take(3)

                  val formatted = matches.map { word ->
                      if (prefix.firstOrNull()?.isUpperCase() == true || isShifted) {
                          word.replaceFirstChar { it.uppercase() }
                      } else {
                          word
                      }
                  }
                  return if (formatted.isNotEmpty()) formatted else listOf(prefix)
              }

              private fun applySuggestion(word: String) {
                  val ic = currentInputConnection ?: return
                  val prefix = getCurrentWordPrefix()
                  playTapEffects()
                  if (prefix.isNotEmpty()) {
                      ic.deleteSurroundingText(prefix.length, 0)
                  }
                  ic.commitText("$word ", 1)
                  if (isShifted) {
                      isShifted = false
                      rebuildKeys()
                  } else {
                      updateSuggestions()
                  }
                  showBadgeMessage("✓ $word")
              }

              private fun updateSuggestions() {
                  if (!::suggestionBar.isInitialized) return
                  val prefix = getCurrentWordPrefix()
                  val words = findPredictions(prefix)
                  suggestionBar.removeAllViews()
                  for (word in words) {
                      val isExactPrefix = word.equals(prefix, ignoreCase = true)
                      suggestionBar.addView(Button(this).apply {
                          text = word
                          isAllCaps = false
                          typeface = Typeface.DEFAULT_BOLD
                          textSize = 13f
                          setTextColor(Color.WHITE)
                          background = makeKeyDrawable(
                              if (isExactPrefix) currentKeyFill else currentAccentFill,
                              currentStrokeColor,
                              18f,
                              2
                          )
                          layoutParams = LinearLayout.LayoutParams(
                              0,
                              78,
                              1f
                          ).apply {
                              marginStart = 3
                              marginEnd = 3
                          }
                          setOnClickListener {
                              applySuggestion(word)
                          }
                      })
                  }
              }

