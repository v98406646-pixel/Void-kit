          package com.example.voidkeys

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.media.AudioAttributes
          import android.media.SoundPool
          import android.os.Build
          import android.os.Bundle
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager
          import android.provider.Settings
          import android.view.inputmethod.InputMethodManager
          import android.webkit.JavascriptInterface
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView
              private lateinit var soundPool: SoundPool
              private var clickSoundId: Int = 0
              private var soundLoaded = false
              private val micRequestCode = 101

              inner class Bridge {
                  @JavascriptInterface
                  fun setTheme(themeId: String) {
                      getSharedPreferences("voidkeys_prefs", Context.MODE_PRIVATE)
                          .edit()
                          .putString("active_theme", themeId)
                          .apply()
                  }

                  @JavascriptInterface
                  fun openInputSettings() {
                      runOnUiThread {
                          startActivity(Intent(Settings.ACTION_INPUT_METHOD_SETTINGS))
                      }
                  }

                  @JavascriptInterface
                  fun openInputPicker() {
                      runOnUiThread {
                          val imm = getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager
                          imm.showInputMethodPicker()
                      }
                  }

                  @JavascriptInterface
                  fun requestMic() {
                      runOnUiThread {
                          ActivityCompat.requestPermissions(
                              this@MainActivity,
                              arrayOf(Manifest.permission.RECORD_AUDIO),
                              micRequestCode
                          )
                      }
                  }

                  @JavascriptInterface
                  fun playClickWithPitch(pitch: Float) {
                      runOnUiThread {
                          if (soundLoaded) {
                              soundPool.play(clickSoundId, 0.85f, 0.85f, 1, 0, pitch.coerceIn(0.5f, 2.0f))
                          }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                              val vm = getSystemService(Context.VIBRATOR_MANAGER_SERVICE) as VibratorManager
                              vm.defaultVibrator.vibrate(
                                  VibrationEffect.createOneShot(18, VibrationEffect.DEFAULT_AMPLITUDE)
                              )
                          } else {
                              @Suppress("DEPRECATION")
                              val vib = getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  vib.vibrate(
                                      VibrationEffect.createOneShot(18, VibrationEffect.DEFAULT_AMPLITUDE)
                                  )
                              } else {
                                  @Suppress("DEPRECATION")
                                  vib.vibrate(18)
                              }
                          }
                      }
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val attrs = AudioAttributes.Builder()
                      .setUsage(AudioAttributes.USAGE_ASSISTANCE_SONIFICATION)
                      .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                      .build()
                  soundPool = SoundPool.Builder()
                      .setMaxStreams(4)
                      .setAudioAttributes(attrs)
                      .build()
                  clickSoundId = soundPool.load(this, R.raw.click, 1)
                  soundPool.setOnLoadCompleteListener { _, _, status ->
                      soundLoaded = (status == 0)
                  }

                  webView = WebView(this).apply {
                      setBackgroundColor(Color.parseColor("#0B0718"))
                      webViewClient = WebViewClient()
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      settings.cacheMode = WebSettings.LOAD_DEFAULT
                      addJavascriptInterface(Bridge(), "AndroidBridge")
                      loadUrl("file:///android_asset/index.html")
                  }

                  setContentView(webView)
              }

              override fun onDestroy() {
                  soundPool.release()
                  super.onDestroy()
              }
          }
          """, overwrite=True)

