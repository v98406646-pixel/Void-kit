            </style>
          </head>
          <body>
            <div class="topbar">
              <div class="brand">
                <div class="logo-badge">👑</div>
                <div>
                  <div class="title">VoidKeys</div>
                  <div class="subtitle">Клавиатуры с уникальными звуками</div>
                </div>
              </div>
              <div class="top-actions">
                <button class="icon-btn" onclick="focusGuide()">⚙️</button>
                <button class="icon-btn" onclick="focusTest()">⌨️</button>
              </div>
            </div>

            <div class="hero">
              <h2>У каждой клавиатуры свой звук 💎</h2>
              <p>Включи VoidKeys, выбери её в системе, переключай RU/EN кнопкой 🌐 и зажимай пробел для голоса.</p>
              <button class="hero-btn" onclick="focusGuide()">Как включить клавиатуру →</button>
            </div>

            <div class="guide-card" id="guideCard">
              <div class="guide-title">Инструкция: куда нажать, чтобы заработала</div>
              <div class="step-line">
                <div class="step-num">1</div>
                <div>Нажми <b>«1. Включить VoidKeys»</b> — откроется экран «Экранная клавиатура». Включи ползунок рядом с <b>VoidKeys</b>.</div>
              </div>
              <div class="step-line">
                <div class="step-num">2</div>
                <div>Нажми <b>«2. Выбрать вместо старой»</b> — откроется окно выбора клавиатуры. Выбери <b>VoidKeys</b> вместо старой клавиатуры.</div>
              </div>
              <div class="step-line">
                <div class="step-num">3</div>
                <div>Печатай слова (например, <b>«при»</b>) — сверху появятся подсказки, зажми <b>«е»</b> для <b>ё / ю</b>, <b>⌫</b> для стирания и пробел для голоса.</div>
              </div>
              <div class="setup-btns">
                <button class="setup-btn" onclick="openImeSettings()">1. Включить VoidKeys</button>
                <button class="setup-btn alt" onclick="openImePicker()">2. Выбрать вместо старой</button>
              </div>
            </div>

            <div class="cats" id="cats"></div>

            <div class="section-head">
              <h3 id="sectionTitle">🔥 Все клавиатуры</h3>
              <span class="active-chip" id="activeChip">Активна: Void Neon</span>
            </div>

            <div class="grid" id="grid"></div>

            <div class="test-box" id="testBox">
              <h3 style="margin:0 0 8px;font-size:15px;">Живой тест клавиатуры и звука</h3>
              <div class="typed-screen" id="typedScreen">Нажми кнопки ниже, чтобы проверить звук и текст...</div>
              <div class="live-pad" id="livePad">
                <div class="live-row">
                  <button class="live-key" onclick="typeDemo('п', this)">п</button>
                  <button class="live-key" onclick="typeDemo('р', this)">р</button>
                  <button class="live-key" onclick="typeDemo('и', this)">и</button>
                  <button class="live-key" onclick="typeDemo('в', this)">в</button>
                  <button class="live-key" onclick="typeDemo('е', this)">е</button>
                  <button class="live-key" onclick="typeDemo('т', this)">т</button>
                </div>
                <div class="live-row">
                  <button class="live-key" onclick="typeDemo('😀', this)">😀</button>
                  <button class="live-key" style="flex:3" onclick="typeDemo(' ', this)">пробел</button>
                  <button class="live-key" onclick="typeDemo('⌫', this)">⌫</button>
                  <button class="live-key" onclick="typeDemo('CLR', this)">очистить</button>
                </div>
              </div>
              <div class="action-row">
                <button class="sec-btn" onclick="openImeSettings()">1. Экранная клавиатура</button>
                <button class="sec-btn" onclick="openImePicker()">2. Выбор клавиатуры</button>
                <button class="sec-btn" onclick="askMic()">🎤 Микрофон</button>
                <button class="sec-btn" onclick="playThemeSound(activeId)">🔊 Звук темы</button>
              </div>
            </div>

            <div class="bottom-nav">
              <button class="nav-item active" id="navHome" onclick="setTab('home')">🏠<span>Главная</span></button>
              <button class="nav-item" id="navFav" onclick="setTab('fav')">★<span>Избранное</span></button>
              <button class="nav-item" id="navIme" onclick="setTab('ime')">⚙️<span>Настройка</span></button>
            </div>

            <script>
              const themes = [
                { id: "void", name: "Void Neon", sub: "Космос + Синт", cat: "Неоновые", tag: "Неон", pitch: 1.15, freq: 580, wave: "sine", bg: "linear-gradient(135deg, #3b0764, #1d4ed8)" },
                { id: "cyber", name: "Cyber Neon", sub: "Молнии + Синт", cat: "Неоновые", tag: "Неон", pitch: 1.35, freq: 880, wave: "sawtooth", bg: "linear-gradient(135deg, #0e7490, #312e81)" },
                { id: "horror", name: "Horror Glitch", sub: "Черепа + Глитч", cat: "Хоррор", tag: "Хоррор", pitch: 0.72, freq: 210, wave: "square", bg: "linear-gradient(135deg, #7f1d1d, #1f090d)" },
                { id: "gaming", name: "Gaming Pro", sub: "Звёзды + Бит", cat: "Игровые", tag: "Игровые", pitch: 1.08, freq: 440, wave: "triangle", bg: "linear-gradient(135deg, #065f46, #111827)" },
                { id: "gold", name: "Gold Luxury", sub: "Корона + Аккорд", cat: "Милые", tag: "Люкс", pitch: 0.92, freq: 660, wave: "sine", bg: "linear-gradient(135deg, #92400e, #451a03)" },
                { id: "crystal", name: "Crystal Magic", sub: "Алмазы + Хрусталь", cat: "Милые", tag: "Милые", pitch: 1.45, freq: 1040, wave: "sine", bg: "linear-gradient(135deg, #6d28d9, #a21caf)" }
              ];
              const categories = ["Все", "Милые", "Неоновые", "Игровые", "Хоррор"];
              let selectedCat = "Все";
              let currentTab = "home";
              let activeId = localStorage.getItem("vk_theme") || "void";
              let favs = JSON.parse(localStorage.getItem("vk_favs") || "[]");
              let typedBuffer = "";
              let audioCtx = null;

              function getThemeObj(id) {
                return themes.find(t => t.id === id) || themes[0];
              }

              function playWebSynth(t) {
                try {
                  if (!audioCtx) {
                    const Ctx = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new Ctx();
                  }
                  if (audioCtx.state === "suspended") audioCtx.resume();
                  const osc = audioCtx.createOscillator();
                  const gain = audioCtx.createGain();
                  osc.type = t.wave;
                  osc.frequency.setValueAtTime(t.freq, audioCtx.currentTime);
                  osc.frequency.exponentialRampToValueAtTime(Math.max(90, t.freq * 0.55), audioCtx.currentTime + 0.055);
                  gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
                  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
                  osc.connect(gain);
                  gain.connect(audioCtx.destination);
                  osc.start();
                  osc.stop(audioCtx.currentTime + 0.065);
                } catch (e) {}
              }

              function playThemeSound(id) {
                const t = getThemeObj(id);
                playWebSynth(t);
                if (window.AndroidBridge && window.AndroidBridge.playClickWithPitch) {
                  window.AndroidBridge.playClickWithPitch(t.pitch);
                }
              }

              function saveState() {
                localStorage.setItem("vk_theme", activeId);
                localStorage.setItem("vk_favs", JSON.stringify(favs));
                if (window.AndroidBridge && window.AndroidBridge.setTheme) {
                  window.AndroidBridge.setTheme(activeId);
                }
              }

              function openImeSettings() {
                if (window.AndroidBridge && window.AndroidBridge.openInputSettings) {
                  window.AndroidBridge.openInputSettings();
                }
              }

              function openImePicker() {
                if (window.AndroidBridge && window.AndroidBridge.openInputPicker) {
                  window.AndroidBridge.openInputPicker();
                }
              }

              function askMic() {
                if (window.AndroidBridge && window.AndroidBridge.requestMic) {
                  window.AndroidBridge.requestMic();
                }
              }

              function focusGuide() {
                const el = document.getElementById("guideCard");
                el.scrollIntoView({ behavior: "smooth", block: "center" });
              }

              function focusTest() {
                const el = document.getElementById("testBox");
                el.scrollIntoView({ behavior: "smooth", block: "center" });
                playThemeSound(activeId);
              }

              function typeDemo(ch, btn) {
                playThemeSound(activeId);
                if (btn) {
                  btn.classList.add("pop");
                  setTimeout(() => btn.classList.remove("pop"), 130);
                }
                if (ch === "CLR") typedBuffer = "";
                else if (ch === "⌫") typedBuffer = typedBuffer.slice(0, -1);
                else typedBuffer += ch;
                const el = document.getElementById("typedScreen");
                el.textContent = typedBuffer.length ? typedBuffer : "Нажми кнопки ниже, чтобы проверить звук и текст...";
              }

              function toggleFav(id, ev) {
                ev.stopPropagation();
                if (favs.includes(id)) favs = favs.filter(x => x !== id);
                else favs.push(id);
                saveState();
                render();
              }

              function selectTheme(id) {
                activeId = id;
                saveState();
                playThemeSound(id);
                render();
              }

              function setTab(tab) {
                currentTab = tab;
                document.getElementById("navHome").classList.toggle("active", tab === "home");
                document.getElementById("navFav").classList.toggle("active", tab === "fav");
                document.getElementById("navIme").classList.toggle("active", tab === "ime");
                if (tab === "ime") {
                  focusGuide();
                }
                render();
              }

              function renderCats() {
                const catsEl = document.getElementById("cats");
                catsEl.innerHTML = "";
                categories.forEach(c => {
                  const btn = document.createElement("button");
                  btn.className = "cat-pill" + (selectedCat === c ? " active" : "");
                  btn.textContent = c === "Все" ? "★ Все" : c;
                  btn.onclick = () => { selectedCat = c; render(); };
                  catsEl.appendChild(btn);
                });
              }

              function render() {
                renderCats();
                const activeObj = getThemeObj(activeId);
                document.getElementById("activeChip").textContent = "Активна: " + activeObj.name;
                document.getElementById("livePad").style.background = activeObj.bg;

                let list = themes.filter(t => selectedCat === "Все" || t.cat === selectedCat);
                if (currentTab === "fav") {
                  list = list.filter(t => favs.includes(t.id));
                  document.getElementById("sectionTitle").textContent = "★ Избранное";
                } else {
                  document.getElementById("sectionTitle").textContent = "🔥 Все клавиатуры (" + list.length + ")";
                }

                const grid = document.getElementById("grid");
                grid.innerHTML = "";
                list.forEach(t => {
                  const isApplied = t.id === activeId;
                  const isFav = favs.includes(t.id);
                  const card = document.createElement("div");
                  card.className = "card";
                  card.innerHTML = `
                    <div class="preview" style="background:${t.bg}">
                      <div class="preview-top">
                        <button class="fav-btn" onclick="toggleFav('${t.id}', event)">${isFav ? "♥" : "♡"}</button>
                      </div>
                      <div class="mini-row">
                        <div class="mini-key">Q</div><div class="mini-key">W</div><div class="mini-key">E</div><div class="mini-key">R</div>
                      </div>
                      <div class="mini-row">
                        <div class="mini-key">A</div><div class="mini-key">S</div><div class="mini-key">D</div><div class="mini-key">F</div>
                      </div>
                    </div>
                    <div class="card-title">${t.name}</div>
                    <div class="card-sub">${t.sub}</div>
                    <div class="card-footer">
                      <span class="card-tag">${t.tag}</span>
                      <button class="install-btn ${isApplied ? "applied" : ""}" onclick="selectTheme('${t.id}')">
                        ${isApplied ? "Активна" : "Установить"}
                      </button>
                    </div>
                  `;
                  grid.appendChild(card);
                });
              }

              render();
            </script>
          </body>
          </html>
          """, overwrite=True)

